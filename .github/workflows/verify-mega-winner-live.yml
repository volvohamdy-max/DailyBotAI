name: Verify Mega Winner Live
on:
  push:
    branches: [live/mega-winner-e2-r3-g1-p1-n4-s0]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/verify-live-static.js
      - run: node --check src/services/scalpStrategies/proStrategyMegaP1.js
      - run: node --check src/services/scalpStrategies/goldRangeMrMegaN4.js
      - run: node scripts/verify-mega-winner-runtime.js
      - run: node scripts/smoke-mega-winner-modules.js
